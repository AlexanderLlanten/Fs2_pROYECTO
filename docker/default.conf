server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Docker vuelve a resolver el servicio si el backend se recrea con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location /api/ { proxy_pass $backend$request_uri; }
    location /media/ { proxy_pass $backend$request_uri; }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP"}';
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    # React Router debe resolver también los enlaces abiertos o recargados directamente.
    location / { try_files $uri $uri/ /index.html; }
}
