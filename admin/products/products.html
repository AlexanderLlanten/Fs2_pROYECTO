<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Administrar productos | KYNEX
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >


    <link
        rel="stylesheet"
        href="../../assets/css/main.css"
    >


    <link
        rel="stylesheet"
        href="../../assets/css/components.css"
    >


    <link
        rel="stylesheet"
        href="../../assets/css/admin.css"
    >

</head>


<body>

    <main>

        <!-- ==================================================
             HEADER
        =================================================== -->

        <section class="page-header">

            <div class="container">

                <p class="section-eyebrow">
                    KYNEX ADMIN
                </p>


                <h1>
                    Productos
                </h1>


                <p>
                    Consulta y administración
                    del catálogo KYNEX.
                </p>

            </div>

        </section>


        <!-- ==================================================
             PRODUCTOS
        =================================================== -->

        <section
            class="admin-section section-spacing"
        >

            <div class="container">

                <div class="admin-toolbar">

                    <div>

                        <p class="section-eyebrow">
                            INVENTARIO
                        </p>


                        <h2>
                            Productos registrados
                        </h2>

                    </div>


                    <a
                        href="product-form.html"
                        class="btn btn-kynex-primary"
                        data-admin-only
                    >

                        <i class="bi bi-plus-lg"></i>

                        Nuevo producto

                    </a>

                </div>


                <!-- TABLA -->

                <div class="admin-table-wrapper">

                    <table class="admin-table">

                        <thead>

                            <tr>

                                <th>
                                    Código
                                </th>

                                <th>
                                    Producto
                                </th>

                                <th>
                                    Categoría
                                </th>

                                <th>
                                    Precio
                                </th>

                                <th>
                                    Stock
                                </th>

                                <th>
                                    Stock crítico
                                </th>

                                <th>
                                    Estado
                                </th>

                                <th>
                                    Acciones
                                </th>

                            </tr>

                        </thead>


                        <tbody
                            id="products-table-body"
                        >
                        </tbody>

                    </table>


                    <div
                        class="admin-empty d-none"
                        id="products-empty"
                    >

                        No hay productos registrados.

                    </div>

                </div>


                <!-- VOLVER -->

                <div class="mt-4">

                    <a
                        href="../index.html"
                        class="btn btn-kynex-secondary"
                    >

                        <i class="bi bi-arrow-left"></i>

                        Volver al panel

                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- ==================================================
         SCRIPTS
    =================================================== -->

    <script
        src="../../assets/js/app.js"
        defer
    ></script>


    <script
        type="module"
        src="../../assets/js/modules/admin-products.js"
    ></script>


    <script
        type="module"
        src="../../assets/js/modules/admin-auth.js"
    ></script>

</body>

</html>
