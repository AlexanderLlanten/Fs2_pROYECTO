<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pedidos | KYNEX Admin</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/main.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/components.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/admin.css"
    >

</head>


<body>

    <main>

        <section class="page-header">

            <div class="container">

                <p class="section-eyebrow">
                    KYNEX ADMIN
                </p>

                <h1>
                    Pedidos
                </h1>

                <p>
                    Consulta y seguimiento de los pedidos
                    realizados en la plataforma.
                </p>

            </div>

        </section>


        <section class="admin-section section-spacing">

            <div class="container">

                <div class="admin-toolbar">

                    <div>

                        <p class="section-eyebrow">
                            GESTIÓN
                        </p>

                        <h2>
                            Pedidos registrados
                        </h2>

                    </div>

                </div>


                <div class="admin-table-wrapper">

                    <table class="admin-table">

                        <thead>

                            <tr>

                                <th>
                                    Pedido
                                </th>

                                <th>
                                    Fecha
                                </th>

                                <th>
                                    Cliente
                                </th>

                                <th>
                                    Productos
                                </th>

                                <th>
                                    Total
                                </th>

                                <th>
                                    Estado
                                </th>

                                <th>
                                    Acción
                                </th>

                            </tr>

                        </thead>


                        <tbody id="orders-table-body">
                        </tbody>

                    </table>

                </div>


                <div class="mt-4">

                    <a
                        href="../index.html"
                        class="btn btn-kynex-secondary"
                    >

                        <i class="bi bi-arrow-left"></i>

                        Volver al panel

                    </a>

                </div>

            </div>

        </section>

    </main>


    <script
        src="../../assets/js/app.js"
        defer
    ></script>


    <script
        type="module"
        src="../../assets/js/modules/admin-orders.js"
    ></script>

    <script
        type="module"
        src="../../assets/js/modules/admin-auth.js"
    ></script>

</body>

</html>
