<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administrar usuarios | KYNEX</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/main.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/components.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/admin.css"
    >

</head>


<body>

    <main>

        <section class="page-header">

            <div class="container">

                <p class="section-eyebrow">
                    KYNEX ADMIN
                </p>

                <h1>
                    Usuarios
                </h1>

                <p>
                    Administración de los usuarios registrados en la plataforma KYNEX.
                </p>

            </div>

        </section>


        <section class="admin-section section-spacing">

            <div class="container">

                <div class="admin-toolbar">

                    <div>

                        <p class="section-eyebrow">
                            GESTIÓN
                        </p>

                        <h2>
                            Usuarios registrados
                        </h2>

                    </div>


                    <a
                        href="user-form.html"
                        class="btn btn-kynex-primary"
                    >
                        <i class="bi bi-person-plus"></i>

                        Crear usuario
                    </a>

                </div>


                <div class="admin-table-wrapper">

                    <table class="admin-table">

                        <thead>

                            <tr>

                                <th>
                                    RUN
                                </th>

                                <th>
                                    Nombre
                                </th>

                                <th>
                                    Correo
                                </th>

                                <th>
                                    Región
                                </th>

                                <th>
                                    Comuna
                                </th>

                                <th>
                                    Rol
                                </th>

                                <th>
                                    Acciones
                                </th>

                            </tr>

                        </thead>


                        <tbody id="users-table-body">
                        </tbody>

                    </table>


                    <div
                        class="admin-empty d-none"
                        id="users-empty"
                    >
                        No hay usuarios registrados.
                    </div>

                </div>


                <div class="mt-4">

                    <a
                        href="../index.html"
                        class="btn btn-kynex-secondary"
                    >
                        Volver al panel
                    </a>

                </div>

            </div>

        </section>

    </main>


    <script
        src="../../assets/js/app.js"
        defer
    ></script>

    <script
        type="module"
        src="../../assets/js/modules/admin-users.js"
    ></script>

    <script
        type="module"
        src="../../assets/js/modules/admin-auth.js"
    ></script>

</body>

</html>
